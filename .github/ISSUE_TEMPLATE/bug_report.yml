name: Bug Report
description: Report a bug in feed polling, status monitoring, dashboard/API, webhook delivery, state, agent rules, or documentation.
title: "[BUG] "
labels: [bug]
assignees: 
  - "PhantomNimbi"
body:
  - type: markdown
    attributes:
      value: "## Bug Description"
  - type: textarea
    id: description
    attributes:
      label: Description
      value: "## Description"
      placeholder: "Please describe the bug you encountered. Include any relevant context or steps to reproduce the issue."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      value: "## Steps to Reproduce"
      placeholder: "Please provide a detailed list of steps to reproduce the bug."
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      value: "## Expected Behavior"
      placeholder: "Please describe what you expected to happen instead of the bug."
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      value: "## Actual Behavior"
      placeholder: "Please describe what actually happened when the bug occurred."
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      value: "## Additional Context"
      placeholder: "Please provide any additional context or information that may be relevant to this bug report."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: "Please ensure you have completed the following before submitting your bug report."
      options:
        - label: I have searched the existing issues to ensure this is not a duplicate.
          required: true
        - label: I have provided a clear and concise description of the bug.
          required: true
        - label: I have provided detailed steps to reproduce the bug.
          required: true
        - label: I have described the expected and actual behavior.
          required: true
        - label: I have provided any additional context or information to support my bug report.
          required: false
  - type: input
    id: contact_info
    attributes:
      label: Contact Information (Optional)
      description: "If you would like to be contacted regarding this bug report, please provide your preferred contact information (e.g., email, Discord username)."
      placeholder: "Email or Discord username"
    validations:
      required: false
  - type: input
    id: related_issues
    attributes:
      label: Related Issues (Optional)
      description: "If this bug report is related to any existing issues, please provide their issue numbers or links."
      placeholder: "e.g., #123, #456"
    validations:
      required: false
  - type: checkboxes
    id: severity
    attributes:
      label: Severity
      description: "Please indicate the severity of the bug."
      options:
        - label: Critical
          required: false
        - label: Major
          required: false
        - label: Minor
          required: false
        - label: Trivial
          required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: "Please specify the environment in which the bug occurred (e.g., operating system, browser, device)."
      options: [Windows, macOS, Linux, Android, iOS, Other]
    validations:
      required: true