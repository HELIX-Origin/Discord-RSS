name: Bug Report
about: Report a bug in feed polling, status monitoring, dashboard/API, webhook delivery, state, agent rules, or documentation.
title: "[BUG] "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        A clear and concise description of what the bug is.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken?
      placeholder: |
        Example: Dedupe misses entries when AppState is not hydrated from the database on startup.
    required: true
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How to trigger the bug.
      placeholder: |
        1. Start the service (`npm start`).
        2. Add a webhook + feed from the dashboard.
        3. Poll and observe duplicate delivery.
    required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repository is affected?
      options:
        - Feed Watcher (`src/feed/watcher.ts`)
        - Feed Parser / XML (`src/feed/parser.ts`, `src/feed/xml.ts`)
        - Status Monitor (`src/status/watcher.ts`)
        - Webhook Delivery (`src/webhook/discord.ts`)
        - State / AppState / Redis (`src/state/*`)
        - Persistence / Schema (`src/db/*`)
        - Auth / OAuth (`src/auth/*`, `src/oauth/*`)
        - Dashboard / API / Router (`src/http/*`, `src/server.ts`)
        - Config / Scheduler (`src/config.ts`, `src/scheduler/*`)
        - TypeScript Build (`tsconfig.json`, `package.json`)
        - Agent Rules (`.agents/rules/*.md`)
        - Agent Bugs (`.agents/bugs/*.md`)
        - Agent Plans (`.agents/plans/*.md`)
        - Agent Skills (`.agents/skills/*.md`)
        - Tests (`tests/*.test.ts`, `vitest.config.ts`)
    required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    required: true
  - type: dropdown
    id: phase
    attributes:
      label: Related Milestone
      description: Which rebuild milestone does this relate to? (GitHub Issue #4 + sub-issues)
      options:
        - #4 / Sub-Issue 1 (Architecture)
        - #4 / Sub-Issue 2 (Implementation)
        - #4 / Sub-Issue 3 (Test Suite)
        - #4 / Sub-Issue 4 (Verification & Docs)
        - None / General
    required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS, Node version, npm version, Discord RSS version.
      placeholder: |
        - OS: Ubuntu / macOS / Windows
        - Node.js: v22.9+
        - npm: v10.x
        - discord-rss: 0.1.0
    required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, stack traces, or unexpected output.
    required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Root Cause Analysis (if known)
      description: What is the likely cause?
    required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Checklist
      description: Confirm the required checks before submitting.
      options:
        - label: I have verified `git status` shows only intended changes
          required: true
        - label: I have not force-pushed (`git push --force`)
          required: true
        - label: I have followed `.agents/rules/agent-safety-compliance.md`
          required: true
        - label: I have included Mermaid diagrams for complex bugs (if applicable)
          required: false
        - label: I have referenced the correct `.agents/bugs/BUG-XXX-*.md` file
          required: false
        - label: I have verified the build passes (`npm run build`)
          required: true