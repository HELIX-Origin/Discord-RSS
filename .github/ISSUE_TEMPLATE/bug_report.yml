name: Bug Report
about: Report a bug in feed discovery, status monitoring, TypeScript modules, webhook handling, agent rules, or documentation.
title: "[BUG] "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        A clear and concise description of what the bug is.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken?
      placeholder: |
        Example: The feed script fails to load webhooks from GitHub Secrets using `{SERVICE_NAME}_WEBHOOK_URL_{###}` naming.
    required: true
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How to trigger the bug.
      placeholder: |
        1. Set `SITE_URL` to a test domain.
        2. Configure `DISCOHOOK_WEBHOOK_URL_001` secret.
        3. Run `npm start`.
        4. Observe error message.
    required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repository is affected?
      options:
        - Feed Parser (`src/handlers/feed.ts`, `src/modules/feed-discovery.ts`)
        - Status Monitor (`src/handlers/status.ts`)
        - Webhook Module (`src/modules/webhook.ts`)
        - State Persistence (`src/functions/atomic-write.ts`)
        - TypeScript Build (`tsconfig.json`, `package.json`)
        - GitHub Actions Workflow (`.github/workflows/*.yml`)
        - Agent Rules (`.agents/rules/*.md`)
        - Agent Bugs (`.agents/bugs/*.md`)
        - Agent Plans (`.agents/plans/*.md`)
        - Agent Skills (`.agents/skills/*.md`)
        - Documentation (`docs/*.md`, `README.md`)
        - Tests (`tests/*.test.ts`, `vitest.config.ts`)
    required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    required: true
  - type: dropdown
    id: phase
    attributes:
      label: Related Agent Phase
      description: Which `.agents/plans/phase*.md` milestone does this relate to?
      options:
        - Phase 1 (Agent Ecosystem)
        - Phase 2 (Python Scripts & State Management — migrated to TypeScript)
        - Phase 3 (Webhook Formatting & Embed Engine)
        - Phase 4 (Status Monitor & Alert Transitions)
        - Phase 5 (Concurrent Safety & Atomic Writes)
        - Phase 6 (Full Test Coverage)
        - Phase 7 (Documentation & Community Template)
        - Phase 8 (Cloudflare Challenge & External APIs)
        - None / General
    required: false
  - type: textarea
    id: secrets_used
    attributes:
      label: GitHub Secrets Used
      description: List any `{SERVICE_NAME}_WEBHOOK_URL_{###}` or `{SOURCE}_RSS_URL_{###}` secrets involved.
      placeholder: |
        - `DISCOHOOK_WEBHOOK_URL_001`
        - `SITE_STATUS_WEBHOOK_URL_001`
        - `FORUM_RSS_URL_001`
    required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS, Python/Node version, TypeScript version, `npm` version.
      placeholder: |
        - OS: Ubuntu / macOS / Windows
        - Node.js: v22.x
        - TypeScript: v5.5
        - `npm`: v10.x
    required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, stack traces, or unexpected output.
    required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Root Cause Analysis (if known)
      description: What is the likely cause?
    required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Checklist
      description: Confirm the required checks before submitting.
      options:
        - label: I have verified `git status` shows only intended changes
          required: true
        - label: I have not force-pushed (`git push --force`)
          required: true
        - label: I have followed `.agents/rules/00-agent-safety-compliance.md`
          required: true
        - label: I have included Mermaid diagrams for complex bugs (if applicable)
          required: false
        - label: I have referenced the correct `.agents/bugs/BUG-XXX-*.md` file
          required: false
        - label: I have verified tests pass (`npm test` / `npm run test`)
          required: true
