name: Post feed updates to Discord

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: post-feed-to-discord
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Post new feed entries
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FEED_URL: ${{ secrets.FEED_URL }}
          ALLOWED_HOSTS: virtualcustoms.net
          EXCLUDED_URL_SUBSTRINGS: forumdisplay.php/766-The-Team,forumdisplay.php?766-The-Team,/766-The-Team
          STATE_FILE: .github/feed-state.json
        run: python scripts/post_feed_to_discord.py

      - name: Persist feed state
        run: |
          if [ -z "$(git status --porcelain -- .github/feed-state.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/feed-state.json
          git commit -m "Update feed state"
          git push
