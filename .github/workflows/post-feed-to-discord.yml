name: Post feed updates to Discord

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: post-feed-to-discord
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  post-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install certifi==2025.08.03 defusedxml==0.7.1 playwright==1.55.0

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.55.0

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Post new feed entries
        env:
          DISCORD WEBHOOK URL 001: ${{ secrets.DISCORD WEBHOOK URL 001 }}
          DISCORD WEBHOOK URL 002: ${{ secrets.DISCORD WEBHOOK URL 002 }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_URLS: ${{ secrets.FEED_URLS }}
          MAX_POSTS: "5"
          STATE_FILE: .github/feed-state.json
        run: python scripts/post_feed_to_discord.py

      - name: Persist feed state
        run: |
          if [ -z "$(git status --porcelain -- .github/feed-state.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/feed-state.json
          git commit -m "Update feed state"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} failed, retrying..."
            sleep 5
          done
          exit 1
