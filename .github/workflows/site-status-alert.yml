name: Site status alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: site-status-alert
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  site-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime dependencies
        run: |
          python -m pip install certifi==2025.08.03 defusedxml==0.7.1

      - name: Run status check
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_STATUS_STATE_FILE: .github/site-status-state.json
        run: python scripts/post_site_status.py

      - name: Persist site status state
        run: |
          if [ -z "$(git status --porcelain -- .github/site-status-state.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/site-status-state.json
          git commit -m "Update site status state"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "Push attempt ${attempt} failed, retrying..."
            sleep 5
          done
