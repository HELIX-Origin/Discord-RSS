name: Wiki Content Sync

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  pull_request:
    branches:
      - main
    paths:
      - 'wiki/**'

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync-to-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Sync Files to Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Configure git credentials globally for the runner
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 2. Clone the wiki repository using the token into a temp directory
          git clone "https://x-access-token:${GH_TOKEN}@://github.com{{ github.repository }}.wiki.git" temp-wiki
          
          # 3. Clear existing wiki files to handle deletions, keeping the .git folder
          find temp-wiki -maxdepth 1 -not -name '.git' -not -name 'temp-wiki' -delete
          
          # 4. Copy current markdown files from your repository's wiki folder
          cp -r wiki/* temp-wiki/
          
          # 5. Commit and push changes if differences exist
          cd temp-wiki
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to sync."
          else
            git commit -m "docs: automated wiki sync"
            git push origin HEAD
          fi
