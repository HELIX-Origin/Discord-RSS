services:
  - type: web
    name: helix-rss
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: helix-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_URL
        value: 0.0.0.0
      - key: DISCORD_PORT
        value: 3131
      - key: SQLITE_DATA
        value: /app/data
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
