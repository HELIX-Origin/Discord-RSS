services:
  - type: web
    name: helix-rss
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CADDY_ENABLED
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: SQLITE_DATA
        value: ./data
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
