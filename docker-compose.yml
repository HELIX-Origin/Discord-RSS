services:
  helix-rss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helix-rss
    restart: unless-stopped
    # Port not exposed externally - Caddy handles external traffic
    expose:
      - "3131"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - INTERNAL_URL=0.0.0.0
      - DISCORD_PORT=3131
      - SQLITE_DATA=/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3131/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - helix-network

  caddy:
    image: caddy:2.8-alpine
    container_name: helix-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - path: .env
        required: false
    environment:
      - DOMAIN=helix-rss.helix-origin.club
      - EMAIL=admin@helix-origin.club
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      helix-rss:
        condition: service_healthy
    networks:
      - helix-network

volumes:
  caddy_data:
  caddy_config:

networks:
  helix-network:
    driver: bridge